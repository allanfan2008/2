<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel-Perfect iOS Neumorphic Toggle Switch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #e2e4e9;
      --track-bg: #d8dbdf;
      --track-inset: 
        inset 10px 10px 22px rgba(160, 165, 180, 0.7),
        inset -10px -10px 22px rgba(255, 255, 255, 0.95);
      
      --handle-bg: linear-gradient(145deg, #ffffff 0%, #dcdee4 100%);
      --handle-shadow: 
        16px 20px 38px rgba(140, 145, 165, 0.5),
        -12px -12px 28px rgba(255, 255, 255, 1),
        inset 1px 1px 2px rgba(255, 255, 255, 0.9);

      --aura-color: rgba(255, 145, 0, 0.55);
      --rim-color: rgba(255, 150, 0, 0.95);
      --rim-shadow: 
        0 0 28px rgba(255, 130, 0, 0.9),
        inset 0 0 16px rgba(255, 160, 0, 0.75);
    }

    .dark-mode {
      --bg-color: #0b0d13;
      --track-bg: #121520;
      --track-inset: 
        inset 10px 10px 22px rgba(2, 3, 6, 0.98),
        inset -8px -8px 18px rgba(35, 42, 60, 0.4);

      --handle-bg: linear-gradient(145deg, #1c2130 0%, #10131c 100%);
      --handle-shadow: 
        18px 22px 42px rgba(0, 0, 0, 0.95),
        -8px -8px 22px rgba(255, 255, 255, 0.04),
        inset 1px 1px 2px rgba(255, 255, 255, 0.15);

      --aura-color: rgba(0, 200, 255, 0.5);
      --rim-color: rgba(0, 210, 255, 0.95);
      --rim-shadow: 
        0 0 30px rgba(0, 210, 255, 0.95),
        inset 0 0 18px rgba(0, 210, 255, 0.8);
    }

    body {
      background-color: var(--bg-color);
      transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Track Container */
    .toggle-track {
      width: 250px;
      height: 130px;
      border-radius: 65px;
      background: var(--track-bg);
      box-shadow: var(--track-inset);
      position: relative;
      cursor: grab;
      transition: background 0.8s ease, box-shadow 0.8s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-track:active {
      cursor: grabbing;
    }

    /* Dynamic Ambient Background Aura Glow */
    .toggle-aura {
      position: absolute;
      top: -70px;
      bottom: -70px;
      left: -70px;
      right: -70px;
      border-radius: 130px;
      background: radial-gradient(circle, var(--aura-color) 0%, rgba(0, 0, 0, 0) 70%);
      opacity: var(--aura-opacity, 0.85);
      filter: blur(32px);
      pointer-events: none;
      transition: background 0.8s ease;
    }

    /* Squircle Toggle Knob */
    .toggle-handle {
      position: absolute;
      top: 11px;
      left: 11px;
      width: 108px;
      height: 108px;
      border-radius: 36px;
      background: var(--handle-bg);
      box-shadow: var(--handle-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      will-change: transform;
      z-index: 10;
    }

    /* Luminous Dynamic Bevel Rim Light */
    .handle-rim-glow {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      border: 2px solid var(--rim-color);
      box-shadow: var(--rim-shadow);
      opacity: var(--rim-opacity, 1);
      pointer-events: none;
      z-index: 12;
      transition: border-color 0.8s ease, box-shadow 0.8s ease;
    }

    /* Top-Right Glass Specular Highlight */
    .handle-glass-specular {
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 65%);
      border-top-right-radius: 36px;
      pointer-events: none;
      z-index: 13;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 11;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Interactive Switch Component -->
  <div class="toggle-track flex items-center justify-center" id="toggleTrack">
    <!-- Diffused Ambient Light Glow -->
    <div class="toggle-aura" id="toggleAura"></div>
    
    <!-- Squircle Drag Knob -->
    <div class="toggle-handle" id="toggleHandle">
      <!-- Glow Edge Rim -->
      <div class="handle-rim-glow" id="handleRim"></div>
      <!-- Glass Lens Reflection -->
      <div class="handle-glass-specular"></div>
      <!-- Particle Icon Canvas -->
      <canvas id="iconCanvas" width="108" height="108"></canvas>
    </div>
  </div>

  <div class="mt-8 text-xs font-semibold tracking-widest uppercase opacity-40 select-none transition-colors duration-700" id="statusText">
    Drag or Tap to Switch Mode
  </div>

  <script>
    let isDark = false;
    let isDragging = false;
    let dragStartX = 0;
    let handleStartX = 0;
    let currentX = 0;

    const TRACK_PADDING = 11;
    const HANDLE_SIZE = 108;
    const MAX_DRAG_X = 250 - HANDLE_SIZE - (TRACK_PADDING * 2); // 120px range

    const body = document.body;
    const toggleTrack = document.getElementById('toggleTrack');
    const toggleHandle = document.getElementById('toggleHandle');
    const toggleAura = document.getElementById('toggleAura');
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    const SIZE = 108;
    const CENTER = SIZE / 2;
    const GRID_SIZE = 4.5;

    // Web Audio Synthesizer SFX
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playClickSound(freq = 440, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.35, audioCtx.currentTime + duration);
        
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Sun Icon Pixel Matrix Grid
    function getSunMatrix() {
      const pixels = [];
      const darkColor = '#1e293b';
      const rayColor = '#334155';

      // Core 3x3 Block
      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          pixels.push({
            x: CENTER + x * (GRID_SIZE + 1.8),
            y: CENTER + y * (GRID_SIZE + 1.8),
            color: darkColor,
            size: GRID_SIZE
          });
        }
      }

      // 8 Rays
      const rays = [
        { x: 0, y: -3.3 }, { x: 0, y: 3.3 },
        { x: -3.3, y: 0 }, { x: 3.3, y: 0 },
        { x: -2.3, y: -2.3 }, { x: 2.3, y: -2.3 },
        { x: -2.3, y: 2.3 },  { x: 2.3, y: 2.3 }
      ];

      rays.forEach(r => {
        pixels.push({
          x: CENTER + r.x * (GRID_SIZE + 1.8),
          y: CENTER + r.y * (GRID_SIZE + 1.8),
          color: rayColor,
          size: GRID_SIZE * 0.85
        });
      });

      return pixels;
    }

    // Moon Icon Pixel Matrix Grid
    function getMoonMatrix() {
      const pixels = [];
      const moonColor = '#f8fafc';
      const starColor = '#94a3b8';

      const gridOffset = GRID_SIZE + 1.8;
      const moonCoords = [
        {x: -1, y: -3}, {x: 0, y: -3},
        {x: -2, y: -2}, {x: -1, y: -2},
        {x: -3, y: -1}, {x: -2, y: -1},
        {x: -3, y: 0},  {x: -2, y: 0},
        {x: -3, y: 1},  {x: -2, y: 1},
        {x: -2, y: 2},  {x: -1, y: 2},
        {x: -1, y: 3},  {x: 0, y: 3}
      ];

      moonCoords.forEach(c => {
        pixels.push({
          x: CENTER + c.x * gridOffset + 4,
          y: CENTER + c.y * gridOffset,
          color: moonColor,
          size: GRID_SIZE
        });
      });

      const stars = [
        { x: -3.6, y: -3 }, { x: 2.4, y: -2.2 }, { x: 3.4, y: 2.2 }
      ];

      stars.forEach(s => {
        pixels.push({
          x: CENTER + s.x * gridOffset,
          y: CENTER + s.y * gridOffset,
          color: starColor,
          size: GRID_SIZE * 0.75
        });
      });

      return pixels;
    }

    const sunPixels = getSunMatrix();
    const moonPixels = getMoonMatrix();
    let particles = [];

    function initStaticIcon(pixels) {
      particles = pixels.map(p => ({
        x: p.x,
        y: p.y,
        targetX: p.x,
        targetY: p.y,
        vx: 0,
        vy: 0,
        color: p.color,
        size: p.size,
        alpha: 1
      }));
    }

    initStaticIcon(sunPixels);

    function renderParticles() {
      ctx.clearRect(0, 0, SIZE, SIZE);
      particles.forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.roundRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size, 1.5);
        ctx.fill();
        ctx.restore();
      });
    }

    renderParticles();

    // Particle Swirl & Dissolve Engine
    function triggerParticleMorph(targetPixels) {
      const startTime = performance.now();
      const duration = 650;

      particles.forEach(p => {
        const angle = Math.atan2(p.y - CENTER, p.x - CENTER) + (Math.random() - 0.5) * 1.8;
        const speed = Math.random() * 24 + 12;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
      });

      while (particles.length < targetPixels.length) {
        const t = targetPixels[particles.length];
        particles.push({
          x: CENTER,
          y: CENTER,
          targetX: t.x,
          targetY: t.y,
          vx: (Math.random() - 0.5) * 26,
          vy: (Math.random() - 0.5) * 26,
          color: t.color,
          size: t.size,
          alpha: 0
        });
      }

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        particles.forEach((p, idx) => {
          if (idx < targetPixels.length) {
            const target = targetPixels[idx];
            p.targetX = target.x;
            p.targetY = target.y;
            p.color = target.color;
            p.size = target.size;
          }

          if (progress < 0.35) {
            p.x += p.vx * 0.16;
            p.y += p.vy * 0.16;
            p.alpha = Math.max(0.15, 1 - progress * 2.2);
          } else {
            const convergence = (progress - 0.35) / 0.65;
            const smoothConv = 1 - Math.pow(1 - convergence, 4);

            p.x += (p.targetX - p.x) * (smoothConv * 0.34);
            p.y += (p.targetY - p.y) * (smoothConv * 0.34);
            p.alpha = Math.min(1, convergence * 1.6);
          }
        });

        renderParticles();

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          initStaticIcon(targetPixels);
          renderParticles();
        }
      }

      requestAnimationFrame(step);
    }

    // State Switch
    function setMode(dark, animateIcon = true) {
      isDark = dark;
      currentX = isDark ? MAX_DRAG_X : 0;
      
      toggleHandle.style.transition = 'transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1)';
      toggleHandle.style.transform = `translateX(${currentX}px)`;
      toggleAura.style.setProperty('--aura-opacity', isDark ? 1 : 0.85);

      if (isDark) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        if (animateIcon) triggerParticleMorph(moonPixels);
        playClickSound(520, 'sine', 0.1);
      } else {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
        if (animateIcon) triggerParticleMorph(sunPixels);
        playClickSound(380, 'sine', 0.1);
      }
    }

    // Pointer Drag & Click Handler Variables
    let pointerHasMoved = false;
    let downClientX = 0;

    function onPointerDown(e) {
      initAudio();
      isDragging = true;
      pointerHasMoved = false;
      downClientX = e.clientX || (e.touches && e.touches[0].clientX);
      dragStartX = downClientX;
      handleStartX = currentX;

      toggleHandle.style.transition = 'none';
      playClickSound(600, 'triangle', 0.04);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      if (Math.abs(clientX - downClientX) > 4) {
        pointerHasMoved = true;
      }
      const deltaX = clientX - dragStartX;
      currentX = handleStartX + deltaX;
      
      const clampedX = Math.max(0, Math.min(currentX, MAX_DRAG_X));
      toggleHandle.style.transform = `translateX(${clampedX}px)`;
      const progress = clampedX / MAX_DRAG_X;
      toggleAura.style.setProperty('--aura-opacity', 0.45 + progress * 0.55);
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;

      // If it was just a quick click/tap without dragging, toggle the state instantly!
      if (!pointerHasMoved) {
        setMode(!isDark, true);
        return;
      }

      const threshold = MAX_DRAG_X / 2;
      if (currentX > threshold) {
        setMode(true, !isDark);
      } else {
        setMode(false, isDark);
      }
    }

    // Event listeners
    toggleTrack.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    toggleTrack.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);
  </script>
</body>
</html>
