<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Control Center Ultra Toggle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 外部控制中心容器 */
        .toggle-container {
            position: relative;
            width: 140px;
            height: 280px;
            background: rgba(20, 25, 38, 0.7);
            border-radius: 46px;
            padding: 8px;
            box-shadow: 
                inset 0 6px 16px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.08),
                0 25px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            cursor: grab;
        }

        .toggle-container:active {
            cursor: grabbing;
        }

        /* 畫布：用來渲染精緻高光、毛玻璃、陰影與動態粒子 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 40px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="toggle-container" id="toggleContainer">
        <canvas id="canvas" width="280" height="560"></canvas>
    </div>

    <script>
        const container = document.getElementById('toggleContainer');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 狀態參數
        let isNight = false;
        let progress = 0.0; // 0.0 (Day) 到 1.0 (Night)
        let targetProgress = 0.0;
        let isDragging = false;
        let startY = 0;
        let startProgress = 0.0;

        // 尺寸設定 (內部解析度 280x560)
        const width = 280;
        const height = 560;
        const padding = 14;
        const thumbWidth = width - padding * 2;
        const thumbHeight = 240;
        const minY = padding;
        const maxY = height - thumbHeight - padding;

        // 建立粒子系統 (用於模擬影片中的圖示解體與重組)
        class ParticleSystem {
            constructor() {
                this.particles = [];
                for (let i = 0; i < 45; i++) {
                    this.particles.push({
                        x: 0, y: 0,
                        baseX: 0, baseY: 0,
                        targetX: 0, targetY: 0,
                        vx: 0, vy: 0,
                        size: Math.random() * 3 + 2,
                        alpha: 1
                    });
                }
            }

            // 生成太陽的像素點矩陣座標
            getSunShape(cx, cy) {
                let pts = [];
                // 中心核心
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dy = -2; dy <= 2; dy++) {
                        if (Math.abs(dx) + Math.abs(dy) <= 3) {
                            pts.push({ x: cx + dx * 5, y: cy + dy * 5 });
                        }
                    }
                }
                // 四周光芒點
                const angles = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, 5*Math.PI/4, 3*Math.PI/2, 7*Math.PI/4];
                angles.forEach(a => {
                    pts.push({ x: cx + Math.cos(a) * 22, y: cy + Math.sin(a) * 22 });
                    pts.push({ x: cx + Math.cos(a) * 15, y: cy + Math.sin(a) * 15 });
                });
                return pts;
            }

            // 生成月亮的像素點矩陣座標
            getMoonShape(cx, cy) {
                let pts = [];
                for (let r = -16; r <= 16; r += 5) {
                    for (let c = -16; c <= 16; c += 5) {
                        let dist1 = Math.sqrt(r*r + c*c);
                        let dist2 = Math.sqrt((r-6)*(r-6) + c*c);
                        if (dist1 <= 18 && dist2 > 11) {
                            pts.push({ x: cx + r, y: cy + c });
                        }
                    }
                }
                // 補充一些星光點
                pts.push({ x: cx - 22, y: cy - 12 });
                pts.push({ x: cx + 18, y: cy + 14 });
                pts.push({ x: cx - 15, y: cy + 18 });
                return pts;
            }

            update(prog, thumbCenterY) {
                let sunPts = this.getSunShape(width / 2, thumbCenterY);
                let moonPts = this.getMoonShape(width / 2, thumbCenterY);

                // 確保粒子數量匹配
                while(sunPts.length < this.particles.length) sunPts.push(sunPts[0]);
                while(moonPts.length < this.particles.length) moonPts.push(moonPts[0]);

                for (let i = 0; i < this.particles.length; i++) {
                    let p = this.particles[i];
                    let sp = sunPts[i];
                    let mp = moonPts[i];

                    // 依據進度內插目標位置 (prog 從 0 到 1)
                    p.targetX = sp.x + (mp.x - sp.x) * prog;
                    p.targetY = sp.y + (mp.y - sp.y) * prog;

                    // 當正在轉場時加入亂數擾動 (模擬粒子旋轉解體)
                    let turbulence = Math.sin(prog * Math.PI) * 15;
                    let targetXWithTurbulence = p.targetX + (Math.sin(i + prog * 10) * turbulence);
                    let targetYWithTurbulence = p.targetY + (Math.cos(i * 1.5 + prog * 10) * turbulence);

                    // 彈簧物理運動
                    p.vx += (targetXWithTurbulence - p.x) * 0.2;
                    p.vy += (targetYWithTurbulence - p.y) * 0.2;
                    p.vx *= 0.7; // 阻尼
                    p.vy *= 0.7;
                    p.x += p.vx;
                    p.y += p.vy;
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#ffffff';
                for (let p of this.particles) {
                    ctx.beginPath();
                    ctx.roundRect(p.x - 2.5, p.y - 2.5, 5, 5, 1.5);
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0; // 重置
                }
            }
        }

        const particleSystem = new ParticleSystem();

        // 繪製主循環
        function render() {
            // 彈簧過渡動畫
            progress += (targetProgress - progress) * 0.15;

            ctx.clearRect(0, 0, width, height);

            // 1. 計算滑塊目前 Y 座標
            const currentThumbY = minY + progress * (maxY - minY);
            const thumbCenterY = currentThumbY + thumbHeight / 2;

            // 2. 顏色色彩過渡 (Day: 暖金黃光 ⇄ Night: 極光湛藍)
            const glowR = Math.round(255 + (0 - 255) * progress);
            const glowG = Math.round(180 + (210 - 180) * progress);
            const glowB = Math.round(50 + (255 - 50) * progress);
            const glowColorStr = `rgba(${glowR}, ${glowG}, ${glowB}, 0.85)`;

            // 背景整體色調過渡
            document.body.style.backgroundColor = `rgb(${Math.round(11 + progress * 2)}, ${Math.round(15 + progress * 2)}, ${Math.round(25 - progress * 5)})`;

            // 3. 繪製軌道內部凹槽陰影
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(padding, padding, width - padding * 2, height - padding * 2, 36);
            ctx.fillStyle = isNight ? '#0e121d' : '#d8d8dc';
            ctx.fill();
            ctx.restore();

            // 4. 繪製滑塊邊緣外發光 (Aura Glow)
            ctx.save();
            ctx.shadowColor = glowColorStr;
            ctx.shadowBlur = 35 + Math.sin(progress * Math.PI) * 10;
            ctx.beginPath();
            ctx.roundRect(padding, currentThumbY, thumbWidth, thumbHeight, 32);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();
            ctx.restore();

            // 5. 繪製滑塊本體 (Neumorphic Squircle 漸層與高光)
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(padding, currentThumbY, thumbWidth, thumbHeight, 32);
            
            let thumbGrad = ctx.createLinearGradient(0, currentThumbY, 0, currentThumbY + thumbHeight);
            if (isNight || progress > 0.5) {
                thumbGrad.addColorStop(0, '#283048');
                thumbGrad.addColorStop(1, '#151925');
            } else {
                thumbGrad.addColorStop(0, '#ffffff');
                thumbGrad.addColorStop(1, '#e0e0e6');
            }
            ctx.fillStyle = thumbGrad;
            ctx.fill();

            // 內部精緻浮雕邊框
            ctx.strokeStyle = isNight ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // 6. 頂部高光折射 (鏡面反光效果，完美貼合圓角)
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(padding + 2, currentThumbY + 2, thumbWidth - 4, thumbHeight * 0.4, {tl: 30, tr: 30, bl: 0, br: 0});
            let glossGrad = ctx.createLinearGradient(0, currentThumbY, 0, currentThumbY + thumbHeight * 0.4);
            glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
            glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = glossGrad;
            ctx.fill();
            ctx.restore();

            // 7. 更新並繪製動態粒子圖示系統
            particleSystem.update(progress, thumbCenterY);
            particleSystem.draw(ctx);

            requestAnimationFrame(render);
        }

        // 互動事件控制 (支援滑鼠與觸控點擊、拖曳)
        function getClientY(e) {
            return e.touches ? e.touches[0].clientY : e.clientY;
        }

        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startY = getClientY(e);
            startProgress = progress;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaY = getClientY(e) - startY;
            const trackSpan = maxY - minY;
            let newProg = startProgress + (deltaY / trackSpan);
            targetProgress = Math.max(0, Math.min(1, newProg));
        });

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            // 超過一半自動吸附到頂部或底部
            if (targetProgress > 0.5) {
                targetProgress = 1.0;
                isNight = true;
            } else {
                targetProgress = 0.0;
                isNight = false;
            }
        }

        container.addEventListener('pointerup', endDrag);
        container.addEventListener('pointercancel', endDrag);

        // 點擊切換支援
        container.addEventListener('click', (e) => {
            // 如果剛才是拖曳結束，則不觸發點擊切換
            if (Math.abs(getClientY(e) - startY) > 5 && isDragging) return;
            isNight = !isNight;
            targetProgress = isNight ? 1.0 : 0.0;
        });

        // 啟動動畫
        requestAnimationFrame(render);
    </script>
</body>
</html>
